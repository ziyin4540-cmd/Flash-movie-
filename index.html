<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flâsh Movie Pro - Streaming</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 0; }
        header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        h1 { color: #f43f5e; margin: 0; font-size: 22px; }
        .nav-btn { background: #f43f5e; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .cat-chip { background: #334155; color: white; padding: 8px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 14px; }
        .cat-chip.active, .cat-chip:hover { background: #f43f5e; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .video-card { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
        .video-thumb { width: 100%; height: 160px; background: #475569; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; }
        .video-info { padding: 15px; }
        .video-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .video-cat { font-size: 12px; color: #f43f5e; margin-bottom: 10px; }
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <h1>Flâsh Movie Pro</h1>
        <button class="nav-btn" onclick="openLogin()">Admin Login</button>
    </header>

    <div class="container">
        <!-- Categories -->
        <div class="categories">
            <div class="cat-chip active" onclick="filterCat('all')">All / အားလုံး</div>
            <div class="cat-chip" onclick="filterCat('dtac')">Dtac</div>
            <div class="cat-chip" onclick="filterCat('ais')">AIS</div>
            <div class="cat-chip" onclick="filterCat('true')">True</div>
            <div class="cat-chip" onclick="filterCat('wifi')">Sim & Wifi</div>
            <div class="cat-chip" onclick="filterCat('starlink-old')">Starlink Old</div>
            <div class="cat-chip" onclick="filterCat('starlink-new')">Starlink New</div>
        </div>

        <!-- Video List Grid -->
        <div class="video-grid" id="videoGrid">
            <div class="video-card">
                <div class="video-thumb">Video Player Placeholder</div>
                <div class="video-info">
                    <div class="video-cat">Dtac Network</div>
                    <div class="video-title">Sample Movie / Video 1</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3>Admin Panel Login</h3>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="nav-btn" style="width: 100%; margin-top: 10px;" onclick="alert('Admin Login System Connected!')">Login</button>
            <button class="nav-btn" style="width: 100%; margin-top: 5px; background: #475569;" onclick="closeLogin()">Cancel</button>
        </div>
    </div>

    <script>
        function openLogin() {
            document.getElementById('loginModal').style.display = 'flex';
        }
        function closeLogin() {
            document.getElementById('loginModal').style.display = 'none';
        }
        function filterCat(cat) {
            document.querySelectorAll('.cat-chip').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
