<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flâsh Movie - YouTube Style Platform</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 0; }
        header { background: #212121; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #383838; position: sticky; top: 0; z-index: 100; }
        .logo { color: #ff0000; font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .upload-btn { background: #ff0000; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .video-card { background: #212121; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #383838; }
        .video-thumb { width: 100%; height: 160px; background: #3f3f3f; display: flex; align-items: center; justify-content: center; color: #aaa; }
        .video-details { padding: 12px; }
        .video-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; }
        .video-stats { font-size: 12px; color: #aaa; }
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: #212121; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid #383838; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin: 10px 0; background: #121212; border: 1px solid #383838; color: white; border-radius: 6px; box-sizing: border-box; }
        .action-bar { display: flex; gap: 15px; margin-top: 10px; font-size: 14px; color: #aaa; }
        .action-bar span { cursor: pointer; }
        .action-bar span:hover { color: #ff0000; }
    </style>
</head>
<body>

    <header>
        <div class="logo">▶ Flâsh Movie</div>
        <button class="upload-btn" onclick="openUploadModal()">+ Upload Video</button>
    </header>

    <div class="container">
        <h3>Trending Videos</h3>
        <div class="video-grid" id="videoGrid">
            <!-- Sample Video Card -->
            <div class="video-card">
                <div class="video-thumb">Flâsh Movie Player</div>
                <div class="video-details">
                    <div class="video-title">Flâsh Movie Pro - Official Teaser</div>
                    <div class="video-stats">1.2K views • 2 hours ago</div>
                    <div class="action-bar">
                        <span onclick="alert('Liked!')">👍 Like</span>
                        <span onclick="alert('Saved to Library!')">💾 Save</span>
                        <span onclick="alert('Reported!')">⚠️ Report</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h3>Upload Video to Flâsh Movie</h3>
            <input type="text" id="videoTitle" placeholder="Video Title">
            <textarea id="videoDesc" placeholder="Description" rows="3"></textarea>
            <input type="file" id="videoFile" accept="video/*" style="border:none; padding:0;">
            <button class="upload-btn" style="width: 100%; margin-top: 15px;" onclick="alert('Video Uploaded Successfully!')">Publish</button>
            <button class="upload-btn" style="width: 100%; margin-top: 5px; background: #383838;" onclick="closeUploadModal()">Cancel</button>
        </div>
    </div>

    <script>
        function openUploadModal() {
            document.getElementById('uploadModal').style.display = 'flex';
        }
        function closeUploadModal() {
            document.getElementById('uploadModal').style.display = 'none';
        }
    </script>
</body>
</html>
