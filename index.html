<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flâsh Movie - Pro Platform</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding-bottom: 70px; }
        header { background: #0f0f0f; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .logo { color: #ff0000; font-size: 20px; font-weight: bold; }
        .search-bar { display: flex; align-items: center; background: #121212; border: 1px solid #333; border-radius: 20px; padding: 5px 15px; width: 40%; }
        .search-bar input { background: transparent; border: none; color: #fff; width: 100%; outline: none; }
        .header-icons { display: flex; gap: 15px; font-size: 20px; cursor: pointer; align-items: center; }
        
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .video-card { background: #1f1f1f; margin-bottom: 15px; border-radius: 12px; overflow: hidden; position: relative; }
        .video-thumb { width: 100%; height: 220px; background: #000; display: flex; align-items: center; justify-content: center; }
        .video-thumb video { width: 100%; height: 100%; object-fit: cover; }
        .video-info { padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; }
        .details h4 { margin: 0 0 5px 0; font-size: 16px; }
        .details p { margin: 0; font-size: 12px; color: #aaa; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #212121; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 1000; }
        nav div { text-align: center; font-size: 11px; color: #aaa; cursor: pointer; }
        nav div.active { color: #fff; }
        nav div span { display: block; font-size: 18px; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #212121; padding: 20px; border-radius: 12px; width: 90%; max-width: 450px; border: 1px solid #333; max-height: 85vh; overflow-y: auto; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin: 8px 0; background: #121212; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .btn { background: #ff0000; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-secondary { background: #333; }
        
        .progress-bar-bg { width: 100%; background: #333; border-radius: 4px; overflow: hidden; height: 10px; margin-top: 10px; display: none; }
        .progress-bar-fill { width: 0%; height: 100%; background: #ff0000; }
    </style>
</head>
<body>

    <header>
        <div class="logo">▶ Flâsh Movie</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search videos..." onkeyup="searchVideos()">
        </div>
        <div class="header-icons">
            <span onclick="openAdminModal()" title="Admin Panel">🛡️</span>
            <span id="userProfileIcon" onclick="openLoginModal()" title="Login">👤</span>
        </div>
    </header>

    <div class="container" id="videoContainer">
        <!-- ဗီဒီယိုများ ဤနေရာတွင် ပေါ်လာမည် -->
    </div>

    <!-- Upload Modal -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h3>Upload Video</h3>
            <input type="text" id="upTitle" placeholder="Video Title">
            <textarea id="upDesc" placeholder="Description" rows="2"></textarea>
            <input type="file" id="upFile" accept="video/*" style="border:none; padding:0; margin-top:10px;">
            
            <p id="progressText" style="font-size: 12px; margin: 5px 0; text-align: right; display:none;">Uploading: 0%</p>
            <div class="progress-bar-bg" id="progressBarBg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>

            <button class="btn" onclick="uploadVideo()">Upload Video</button>
            <button class="btn btn-secondary" onclick="closeModal('uploadModal')">Cancel</button>
        </div>
    </div>

    <!-- Custom Fast Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content" style="text-align: center;">
            <h3>Sign in to Flâsh Movie</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 15px;">Enter your username or channel name to continue</p>
            
            <input type="text" id="customUsername" placeholder="e.g. @ZiYin" style="text-align: center; font-size: 16px;">
            <button class="btn" onclick="loginCustomUser()">Sign In / Create Account</button>
            <button class="btn btn-secondary" style="margin-top: 10px;" onclick="closeModal('loginModal')">Close</button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3>Admin Panel</h3>
            <div id="adminLoginSection">
                <input type="password" id="adminPass" placeholder="Enter Password">
                <button class="btn" onclick="verifyAdmin()">Login Admin</button>
            </div>
            <div id="adminDashboard" style="display:none;">
                <p style="color: #10b981; font-weight: bold;">Status: Logged In as Admin</p>
                <h4>Video Management & Moderation:</h4>
                <div id="adminVideoList" style="background: #121212; padding: 10px; border-radius: 6px; margin: 10px 0; max-height: 250px; overflow-y: auto; font-size: 13px;">
                    <!-- Videos to delete -->
                </div>
                <button class="btn btn-secondary" onclick="closeModal('adminModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav>
        <div class="active" onclick="switchNav(0)"><span>🏠</span>Home</div>
        <div onclick="switchNav(1)"><span>🩳</span>Shorts</div>
        <div onclick="checkLoginAndUpload()"><span>➕</span>Upload</div>
        <div onclick="openLoginModal()"><span id="navUserIcon">👤</span><span id="navUserName">You</span></div>
    </nav>

    <script>
        let videos = JSON.parse(localStorage.getItem('flash_videos')) || [];
        let currentUser = localStorage.getItem('flash_current_user') || null;

        function checkLoginAndUpload() {
            if(!currentUser) {
                alert('Please sign in first!');
                openLoginModal();
            } else {
                openUploadModal();
            }
        }

        function openUploadModal() { if(currentUser) document.getElementById('uploadModal').style.display = 'flex'; }
        function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

        function loginCustomUser() {
            const uname = document.getElementById('customUsername').value.trim();
            if(!uname) {
                alert('Please enter a valid username!');
                return;
            }
            currentUser = uname.startsWith('@') ? uname : '@' + uname;
            localStorage.setItem('flash_current_user', currentUser);
            document.getElementById('navUserName').innerText = currentUser;
            alert('Signed in successfully as ' + currentUser);
            closeModal('loginModal');
        }

        function uploadVideo() {
            const title = document.getElementById('upTitle').value;
            const desc = document.getElementById('upDesc').value;
            const fileInput = document.getElementById('upFile');
            
            if(!title || fileInput.files.length === 0) {
                alert('Please enter title and select a video file!');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            document.getElementById('progressText').style.display = 'block';
            document.getElementById('progressBarBg').style.display = 'block';

            let progress = 0;
            let interval = setInterval(() => {
                progress += 5;
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('progressText').innerText = 'Uploading: ' + progress + '%';
                
                if(progress >= 100) {
                    clearInterval(interval);
                    reader.onload = function(e) {
                        const videoObj = {
                            id: Date.now(),
                            title: title,
                            desc: desc,
                            url: e.target.result,
                            uploader: currentUser,
                            time: 'Just now'
                        };
                        videos.unshift(videoObj);
                        localStorage.setItem('flash_videos', JSON.stringify(videos));
                        renderVideos();
                        alert('Video Uploaded Successfully!');
                        closeModal('uploadModal');
                        document.getElementById('progressBarBg').style.display = 'none';
                        document.getElementById('progressText').style.display = 'none';
                        document.getElementById('upTitle').value = '';
                        document.getElementById('upDesc').value = '';
                        document.getElementById('upFile').value = '';
                    };
                    reader.readAsDataURL(file);
                }
            }, 100);
        }

        function renderVideos(filter = '') {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';
            
            const filtered = videos.filter(v => v.title.toLowerCase().includes(filter.toLowerCase()));
            
            if(filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:40px;">No videos found.</p>';
                return;
            }

            filtered.forEach(v => {
                container.innerHTML += `
                    <div class="video-card">
                        <div class="video-thumb">
                            <video src="${v.url}" controls></video>
                        </div>
                        <div class="video-info">
                            <div>
                                <h4>${v.title}</h4>
                                <p>By ${v.uploader} • ${v.time}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function searchVideos() {
            const query = document.getElementById('searchInput').value;
            renderVideos(query);
        }

        function verifyAdmin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === '295802') {
                document.getElementById('adminLoginSection').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                renderAdminData();
            } else {
                alert('Incorrect Password!');
            }
        }

        function renderAdminData() {
            const vidDiv = document.getElementById('adminVideoList');
            vidDiv.innerHTML = '';
            if(videos.length === 0) {
                vidDiv.innerHTML = '<p>No videos uploaded yet.</p>';
                return;
            }
            videos.forEach(v => {
                vidDiv.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid #222; padding-bottom:5px;">
                        <span><b>${v.title}</b><br><small style="color:#aaa;">Uploader: ${v.uploader}</small></span>
                        <button class="delete-btn" onclick="adminDeleteVideo(${v.id})">Delete</button>
                    </div>
                `;
            });
        }

        function adminDeleteVideo(id) {
            videos = videos.filter(v => v.id !== id);
            localStorage.setItem('flash_videos', JSON.stringify(videos));
            renderVideos();
            renderAdminData();
            alert('Video deleted by Admin!');
        }

        function switchNav(index) {
            const navs = document.querySelectorAll('nav div');
            navs.forEach((el, i) => {
                if(i === index) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        if(currentUser) {
            document.getElementById('navUserName').innerText = currentUser;
        }
        renderVideos();
    </script>
</body>
</html>
