<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flâsh Movie Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Intro Screen -->
    <div id="intro-screen" class="intro-container">
        <h1 class="lightning-text">⚡ FLÂSH MOVIE PRO ⚡</h1>
    </div>

    <!-- Main App -->
    <div id="app-container" class="hidden">
        <header class="app-header">
            <h2 class="logo-text">▶ Flâsh Movie</h2>
            <div id="account-timer" class="timer-box">0Y / 0M / 0D / 0H / 0M / 0S</div>
        </header>

        <!-- Pages Container -->
        <main class="content-body">
            <!-- Home Page -->
            <section id="page-home" class="page-section">
                <div class="filter-tabs">
                    <button class="filter-btn active">All</button>
                    <button class="filter-btn">Videos</button>
                    <button class="filter-btn">Shorts</button>
                </div>
                <div id="videoFeed"></div>
            </section>

            <!-- Upload Page (Admin Panel) -->
            <section id="page-upload" class="page-section hidden">
                <h2>⚡ Upload New Content</h2>
                <div class="upload-form">
                    <label>Content Type:</label>
                    <select id="contentType">
                        <option value="Video">Video</option>
                        <option value="Shorts">Shorts</option>
                    </select>

                    <label><input type="checkbox" id="playlistMode"> Playlist Mode</label>
                    <input type="text" id="playlistName" placeholder="Playlist / Movie Series Name">
                    <input type="text" id="videoTitle" placeholder="Title / Caption">
                    
                    <label class="file-label">Select File:</label>
                    <input type="file" id="deviceFilePicker" accept="video/*">
                    
                    <button id="uploadNowBtn" class="primary-btn">Upload Now</button>
                </div>
            </section>

            <!-- Profile Page -->
            <section id="page-profile" class="page-section hidden">
                <div class="profile-box">
                    <div class="avatar">Z</div>
                    <h3>@ziyin</h3>
                    <p>Followers: 0 | Following: 0</p>
                    <div class="device-limit-box">📱 Device Account Limit: 0 / 2 Accounts used</div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button onclick="switchPage('home')">🏠 Home</button>
            <button onclick="switchPage('shorts')">🩳 Shorts</button>
            <button onclick="switchPage('posts')">📝 Posts</button>
            <button onclick="switchPage('upload')">➕ Upload</button>
            <button onclick="switchPage('profile')">👤 Profile</button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
