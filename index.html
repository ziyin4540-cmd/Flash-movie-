<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flâsh Movie Pro - YouTube Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Intro Animation -->
    <div id="intro-screen" class="intro-container">
        <h1 class="lightning-text">⚡ FLÂSH MOVIE PRO ⚡</h1>
        <p>Loading YouTube Experience...</p>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="hidden">
        <!-- YouTube Header -->
        <header class="yt-header">
            <div class="logo-area"><h2>▶ Flâsh Tube</h2></div>
            <div id="account-timer" class="timer-box">0Y / 0M / 0D / 0H / 0M / 0S</div>
        </header>

        <div class="yt-main-layout">
            <!-- Video Player & Details Area -->
            <section class="video-section">
                <div class="video-container">
                    <video id="mainVideoPlayer" controls width="100%"></video>
                </div>
                
                <!-- Local File Picker (No URL / Direct from Phone) -->
                <div class="file-picker-box">
                    <label for="deviceFilePicker" class="upload-btn">📁 ဖုန်းထဲမှ ဗီဒီယိုရွေးမည်</label>
                    <input type="file" id="deviceFilePicker" accept="video/*" style="display:none;">
                    <span id="fileNameDisplay">ဖိုင်မရှိသေးပါ</span>
                </div>

                <div class="video-info">
                    <h3>Flâsh Movie Pro - Live Stream & Video Player</h3>
                    <p class="channel-name">Flâsh Official • 1M Views</p>
                </div>

                <!-- Comments & Conversations Section -->
                <div class="comments-section">
                    <h3>မှတ်ချက်များနှင့် Conversation များ</h3>
                    <div class="comment-input-box">
                        <input type="text" id="commentInput" placeholder="အများနဲ့ ဆွေးနွေးရန် မှတ်ချက်ရေးပါ...">
                        <button id="sendCommentBtn">တင်မည်</button>
                    </div>
                    <div id="commentsList" class="comments-list"></div>
                </div>
            </section>

            <!-- Sidebar Chat Room -->
            <aside class="chat-sidebar">
                <h3>💬 Live Chat & Conversation</h3>
                <div id="chatRoom" class="chat-room"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="စာတိုပို့ရန်...">
                    <button id="sendChatBtn">ပို့</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
